[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-assistant-api"
version = "0.1.0"
description = "AI destekli şirket içi doküman asistanının FastAPI backend uygulaması"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiofiles",
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "langchain-core",
    "langchain-ollama",
    "langchain-text-splitters",
    "pgvector",
    "pydantic-settings",
    "pypdf",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "pytest-asyncio",
    "reportlab",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
