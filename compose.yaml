services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_document_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./apps/api
    # .env opsiyonel: yoksa buradaki ve config.py'deki varsayılanlar kullanılır.
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_document_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      # Konteyner ağı içindeki adresler .env'deki host değerlerini ezer.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Ollama host makinede çalışır (GPU ve indirilmiş modeller orada).
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      STORAGE_DIRECTORY: storage/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./apps/web
    # 5173: API'nin CORS listesi bu portu bekliyor.
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
